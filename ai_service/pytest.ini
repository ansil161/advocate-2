[pytest]
# rootdir is ai/, so `app` and `tests` are both importable without the suite
# needing PYTHONPATH set by whoever runs it.
pythonpath = .
testpaths = tests
asyncio_mode = auto
# Every async fixture and test shares one loop per module, which is what the
# httpx/qdrant clients expect.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:httpx.*
